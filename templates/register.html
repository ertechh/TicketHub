{% extends "base.html" %}

{% block title %}Sign Up - TicketHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="text-center mb-4">
                <h1 class="fw-bold text-white">Create Account</h1>
                <p class="text-secondary">Join TicketHub and start discovering events</p>
            </div>
            
            <div class="bg-card p-4 rounded-4 border border-secondary">
                <form method="POST">
                    <div class="mb-3">
                        <label class="fw-semibold mb-2 text-white">Username</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" 
                               placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-semibold mb-2 text-white">Email</label>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" 
                               placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-semibold mb-2 text-white">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" 
                               placeholder="At least 8 characters" required>
                    </div>
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_seller" value="yes" id="isSeller">
                            <label class="form-check-label text-secondary" for="isSeller">
                                I want to sell tickets on this platform
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-accent w-100 py-2">
                        <i class="fas fa-user-plus me-2"></i> Create Account
                    </button>
                </form>
                <p class="text-center text-secondary mt-3">
                    Already have an account? <a href="/login" class="text-accent fw-bold">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
