{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
    <div style="max-width: 400px; margin: 0 auto;">
        <h2>Create Account</h2>
        <div class="card">
            <form method="POST">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 500; margin-bottom: 0.25rem;">Username</label>
                    <input type="text" name="username" required style="width: 100%; padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 500; margin-bottom: 0.25rem;">Email</label>
                    <input type="email" name="email" required style="width: 100%; padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 500; margin-bottom: 0.25rem;">Password</label>
                    <input type="password" name="password" required style="width: 100%; padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="is_seller" value="yes">
                        <span>I want to sell tickets on this platform</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; color: #718096;">
                Already have an account? <a href="/login">Login</a>
            </p>
        </div>
    </div>
{% endblock %}
